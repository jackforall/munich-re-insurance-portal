services:
  - type: web
    name: munich-re-insurance-portal
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    preDeployCommand: pnpm --filter @workspace/db run push
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    disk:
      name: portal-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/objects
      - key: PORTAL_SEED_ENABLED
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: munich-re-insurance-db
          property: connectionString

databases:
  - name: munich-re-insurance-db
    plan: basic-256mb
